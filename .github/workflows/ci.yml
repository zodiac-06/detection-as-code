name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and test rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the Sigma toolchain
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Lint rule metadata and naming
        run: python tools/validate_rules.py

      - name: Run rule unit tests
        run: pytest tests/ -v --tb=short

      - name: Check the ATT&CK coverage map is current
        run: python tools/coverage_map.py --check

  compile:
    name: Compile queries for every backend
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Convert rules
        run: python tools/convert.py

      - name: Summarise conversion results
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          report = json.loads(pathlib.Path("build/conversion-report.json").read_text())
          print("| Target | ok | unsupported | skipped |")
          print("| --- | --- | --- | --- |")
          for target, rules in sorted(report.items()):
              counts = {}
              for result in rules.values():
                  counts[result["status"]] = counts.get(result["status"], 0) + 1
              print(f"| {target} | {counts.get('ok',0)} | {counts.get('unsupported',0)} | {counts.get('skipped',0)} |")
          PY

      - name: Upload compiled queries
        uses: actions/upload-artifact@v4
        with:
          name: compiled-queries
          path: build/
          retention-days: 30

  deploy-preview:
    name: Preview the Sentinel deployment
    runs-on: ubuntu-latest
    needs: compile
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python tools/convert.py

      - name: Show what would be deployed
        run: python deploy/sentinel.py --dry-run
